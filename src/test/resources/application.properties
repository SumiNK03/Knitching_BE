spring.application.name=knitching
server.port=8083

# JPA 설정
spring.datasource.url=jdbc:mysql://localhost:3306/knitchingdb?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=knitching_user
spring.datasource.password=0000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Swagger UI 설정
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT 설정
jwt.secret=thisisaverysecuresecretkey123456thisisaverysecuresecretkey123456
jwt.access-token-validity=86400000

# AWS S3 설정 (테스트 환경에서는 비활성화)
aws.s3.enabled=false
aws.s3.bucket=knitching-storage-2026
